apiVersion: v1
kind: ConfigMap
metadata:
  name: prom-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager.default.svc.cluster.local:9093

    rule_files:
      - /etc/prometheus/alert-rules.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # 1. Look at the annotation 'prometheus.io/scrape' on the pod
          # 2. If it is NOT set to 'true', DROP the pod from the scrape list
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
      
      - job_name: node-exporter
        static_configs:
          - targets: ["node-exporter.default.svc.cluster.local:9100"]
      
      - job_name: ca_advisor
        scrape_interval: 15s
        static_configs:
          - targets:
              - "cadvisor.default.svc.cluster.local:8080"
        
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: 
              - "kube-state-metrics.monitoring.svc.cluster.local:8080"

      - job_name: 'blackbox-http'
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - https://prometheus.io
              - https://www.google.com
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.monitoring.svc.cluster.local:9115

      - job_name: 'flask-app'
        metrics_path: /metrics
        static_configs:
          - targets: ["192.168.0.5:5000"]


  
  alert-rules.yml: |
    groups:
      - name: application-alerts
        rules:
          - alert: FlaskAppDown
            expr: up{job="flask-app"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Flask application is down"
              description: "Prometheus cannot scrape the Flask application."

          - alert: BlackboxProbeFailed
            expr: probe_success{job="blackbox-http"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Endpoint probe failed"
              description: "Blackbox probe failed for {{ $labels.instance }}."

          - alert: HighNodeDiskUsage
            expr: |
              100 * (
                1 -
                node_filesystem_avail_bytes{
                  mountpoint="/",
                  fstype!~"tmpfs|overlay|squashfs"
                }
                /
                node_filesystem_size_bytes{
                  mountpoint="/",
                  fstype!~"tmpfs|overlay|squashfs"
                }
              ) > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Node disk usage is high"
              description: "Disk usage on {{ $labels.instance }} is above 80%."


---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: prom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus-sa
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prom-config

---

apiVersion: v1
kind: Service
metadata:
  name: prom-service
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '9090'
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      nodePort: 31234
      targetPort: 9090
      protocol: TCP

